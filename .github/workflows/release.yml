name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
        - aarch64-unknown-linux-gnu
        - x86_64-unknown-linux-gnu
        include:
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-24.04-arm
          target_rustflags: ''
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
          target_rustflags: ''
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y libxkbcommon-dev
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.12.0
      - name: Install packaging plugins
        run: |
          cargo binstall -y just cargo-deb cargo-generate-rpm
      - name: Build packages
        id: package
        run: |
          just build-release
          just build-deb
          just build-rpm

          NAME="cosmic-applet-yt-dlp-dixycat"
          ARCH=`uname -m`

          mkdir -p ./$NAME
          cp ./target/release/$NAME ./res/*.desktop ./res/*.metainfo.xml ./res/install.sh ./$NAME/
          strip -s ./$NAME/$NAME
          tar -czvf $NAME-$ARCH.tar.gz $NAME

          cp ./target/debian/*.deb ./
          cp ./target/generate-rpm/*.rpm ./
      - name: Publish artifacts and release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            *.tar.gz
            *.deb
            *.rpm
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  checksum:
    runs-on: ubuntu-latest
    needs:
    - build
    steps:
      - name: Download Release Archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download
          --repo ${{ github.repository }}
          --pattern '*'
          --dir release
          ${{ github.ref_name }}

      - name: Create Checksums
        run: |
          cd release
          shasum -a 256 * > ../SHA256SUMS

      - name: Publish Checksums
        uses: softprops/action-gh-release@v2.2.1
        with:
          draft: false
          files: SHA256SUMS
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        